# Configuracion de pytest.
#
# `asyncio_mode = auto` evita marcar cada prueba con @pytest.mark.asyncio.
# Toda la aplicacion es asincrona, asi que la excepcion seria la prueba
# sincrona, no al reves.
[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
