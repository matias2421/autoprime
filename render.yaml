# Despliegue del backend en Render.
#
# Con este archivo en la raíz, Render ofrece crear el servicio ya configurado
# en lugar de ir rellenando campos a mano en su panel. Los valores que llevan
# `sync: false` no se guardan aquí: son secretos o dependen de direcciones que
# todavía no existen cuando se crea el servicio, y se escriben en el panel.
#
# El plan gratuito duerme el servicio a los 15 minutos sin visitas y tarda
# entre 30 y 60 segundos en despertar. Para sustentar, conviene abrir la URL
# unos minutos antes.

services:
  - type: web
    name: autoprime-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend

    buildCommand: pip install -r requirements.txt

    # El servicio tiene que escuchar en todas las interfaces y en el puerto
    # que Render asigna; con los valores de local no recibiría tráfico.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    # Render consulta esta ruta para decidir si el servicio está sano.
    #
    # Apunta a /vivo, que solo comprueba que el proceso responda, y NO a
    # /salud, que consulta la base. La diferencia costó un despliegue: con
    # /salud aquí, el día que la base desapareció un rato Render nunca
    # obtuvo un 200 y dio por fallido un despliegue que no tenía nada malo.
    #
    # Y el caso peor, que no llegó a darse: con la comprobación atada a la
    # base, un parpadeo de treinta segundos puede hacer que Render reinicie
    # o retire un servicio que funcionaba.
    #
    # /salud sigue existiendo y sigue mirando la base: es el diagnóstico que
    # lee una persona, no el que decide si el servicio está en pie.
    healthCheckPath: /vivo

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"

      - key: ENTORNO
        value: produccion

      # Render genera una clave aleatoria la primera vez y la conserva. Es
      # mejor que traerse la de local: esa ha pasado por el portátil, por el
      # historial de la consola y por las copias del .env.
      - key: SECRET_KEY
        generateValue: true

      # Cadena de conexión de Aiven, tal como la copian de su panel.
      - key: DATABASE_URL
        sync: false

      # El certificado de Aiven, pegado entero (incluidas las lineas BEGIN y
      # END). Con el, la conexion queda cifrada Y verificada.
      #
      # Sin el, la API sigue cifrando -asi esta hecho desde ahora- pero no
      # comprueba con quien habla. Antes era peor: sin certificado no cifraba
      # nada, y en el portatil iba por TLS mientras que en produccion, que es
      # donde la conexion cruza internet de verdad, viajaba en claro.
      #
      # No es un secreto: identifica al servidor, no da acceso. Va aqui y no
      # en el repositorio solo para que el despliegue no dependa de subir un
      # archivo a mano.
      - key: DB_SSL_CA_CONTENIDO
        sync: false

      # La dirección de Vercel, separada por comas si hay varias.
      - key: ORIGENES_PERMITIDOS
        sync: false

      # Con esta se arma el enlace que viaja en el correo de recuperación.
      - key: URL_FRONTEND
        sync: false

      - key: SMTP_HOST
        sync: false
      - key: SMTP_PUERTO
        value: "587"
      - key: SMTP_USUARIO
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_REMITENTE
        sync: false

      # Clave del asistente (https://console.groq.com/keys).
      #
      # `sync: false` es lo importante: Render la pide en el panel y la
      # guarda cifrada, y la clave no pasa nunca por este archivo ni por
      # el repositorio. Una clave de API en un YAML versionado esta a la
      # vista de cualquiera que clone el proyecto, y ya no hay forma de
      # quitarla del historial sin reescribirlo.
      #
      # Si se deja vacia, la API arranca igual: el chat responde que el
      # asistente no esta disponible y el resto del sitio no se entera.
      - key: GROQ_API_KEY
        sync: false
